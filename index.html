<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Reactive Flash Trainer</title>
    <style>
        :root {
            --bg: #FCF7F2;
            --deep: #3D1F6E;
            --orange: #F2631A;
            --blue: #54BAF7;
            --yellow: #FFD447;
            --white: #FFFFFF;
            --black: #000000;
        }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--deep); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: center;
            transition: background 0.1s ease-out; /* Smooth flash transition */
        }
        
        #timer { font-size: 8rem; font-weight: 900; color: var(--deep); line-height: 1; margin: 10px 0; z-index: 2; }
        #status { font-size: 2rem; font-weight: bold; color: var(--orange); text-transform: uppercase; z-index: 2; }
        #set-info { font-size: 1.2rem; margin-bottom: 20px; color: var(--deep); opacity: 0.8; z-index: 2; }

        .card { 
            background: var(--white); 
            padding: 2rem; 
            border-radius: 30px; 
            box-shadow: 0 10px 0 var(--deep);
            width: 85%; 
            max-width: 400px;
            border: 3px solid var(--black);
            z-index: 2;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
