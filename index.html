<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Randomized Interval Pro</title>
    <style>
        :root { --bg: #54494B; --accent: #38bdf8; --card: rgba(255,255,255,0.1); }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        
        #timer { font-size: 8rem; font-weight: bold; line-height: 1; margin: 0; }
        #status { font-size: 2.5rem; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        #set-info { font-size: 1.5rem; margin-bottom: 30px; opacity: 0.8; }

        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; max-width: 400px; margin-bottom: 20px; }
        .input-group { background: var(--card); padding: 10px; border-radius: 12px; }
        .input-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; opacity: 0.7; }
        input { background: transparent; border: none; color: white; font-size: 1.5rem; width: 100%; text-align: center; outline: none; }
        
        .controls { display: flex; gap: 10px; width: 90%; max-width: 400px; }
        button { flex: 1; padding: 20px; font-size: 1.2rem; font-weight: bold; border-radius: 15px; border: none; cursor: pointer; transition: 0.2s; }
        #start-btn { background: var(--accent); color: #0f172a; }
        #pause-btn { background: #f59e0b; color: #0f172a; display: none; }
        .stop { background: #ef4444 !important; color: white !important; }
    </style>
</head>
<body>

    <div id="status">READY</div>
    <div id="timer">0</div>
    <div id="set-info">Set: 0 / 0</div>

    <div class="config-grid" id="setup-ui">
        <div class="input-group">
            <label>Sets</label>
            <input type="number" id="sets" value="3">
        </div>
        <div class="input-group">
            <label>Work (Secs)</label>
            <input type="number" id="work-dur" value="180">
        </div>
        <div class="input-group">
            <label>Rest (Secs)</label>
            <input type="number" id="rest-dur" value="60">
        </div>
        <div class="input-group">
            <label>Rand. Max (Secs)</label>
            <input type="number" id="rand-max" value="15">
        </div>
    </div>

    <div class="controls">
        <button id="start-btn" onclick="toggleStart()">START</button>
        <button id="pause-btn" onclick="togglePause()">PAUSE</button>
    </div>

    <script>
        let interval = null;
        let isRunning = false;
        let isPaused = false;
        let phase = 'PREP'; // PREP, WORK, REST
        let currentSet = 1;
        
        let timeLeft = 10;
        let totalSets = 0;
        let workSecs = 0;
        let restSecs = 0;
        let nextRandomTrigger = 0;

        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const infoEl = document.getElementById('set-info');
        const setupUI = document.getElementById('setup-ui');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');

        // Reusable Audio Context
        let audioCtx = null;

        function playBeep(isHigh = false) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.value = isHigh ? 1000 : 500;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (isHigh ? 0.4 : 0.1));
            
            osc.start();
            osc.stop(audioCtx.currentTime + (isHigh ? 0.4 : 0.1));
        }

        function updateUI() {
            timerEl.textContent = timeLeft;
            statusEl.textContent = phase;
            infoEl.textContent = `Set: ${currentSet} / ${totalSets}`;
            
            if(phase === 'WORK') statusEl.style.color = '#4ade80';
            else if(phase === 'REST') statusEl.style.color = '#f87171';
            else statusEl.style.color = '#38bdf8';
        }

        function tick() {
            if (isPaused) return;

            if (timeLeft <= 5 && timeLeft > 0) playBeep(false);
            if (timeLeft === 1) setTimeout(() => playBeep(true), 1000);

            timeLeft--;

            if (timeLeft < 0) {
                switchPhase();
            }
            updateUI();
        }

        function switchPhase() {
            if (phase === 'PREP') {
                phase = 'WORK';
                timeLeft = workSecs;
            } else if (phase === 'WORK') {
                if (currentSet >= totalSets) {
                    endWorkout();
                    return;
                }
                phase = 'REST';
                timeLeft = restSecs;
            } else if (phase === 'REST') {
                currentSet++;
                phase = 'WORK';
                timeLeft = workSecs;
            }
        }

        function toggleStart() {
            if (isRunning) {
                endWorkout();
            } else {
                // Initialize
                totalSets = parseInt(document.getElementById('sets').value);
                workSecs = parseInt(document.getElementById('work-dur').value);
                restSecs = parseInt(document.getElementById('rest-dur').value);
                
                isRunning = true;
                phase = 'PREP';
                timeLeft = 10;
                currentSet = 1;
                
                setupUI.style.display = 'none';
                startBtn.innerText = 'STOP';
                startBtn.classList.add('stop');
                pauseBtn.style.display = 'block';
                
                updateUI();
                interval = setInterval(tick, 1000);
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? 'RESUME' : 'PAUSE';
            statusEl.textContent = isPaused ? 'PAUSED' : phase;
        }

        function endWorkout() {
            clearInterval(interval);
            isRunning = false;
            isPaused = false;
            setupUI.style.display = 'grid';
            startBtn.innerText = 'START';
            startBtn.classList.remove('stop');
            pauseBtn.style.display = 'none';
            statusEl.textContent = 'COMPLETE';
            statusEl.style.color = '#38bdf8';
            timerEl.textContent = '0';
        }
    </script>
</body>
</html>
