<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Reactive Flash Trainer</title>
    <style>
        :root {
            --bg: #FCF7F2; --deep: #3D1F6E; --orange: #F2631A;
            --blue: #54BAF7; --yellow: #FFD447; --white: #FFFFFF; --black: #000000;
        }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); 
            color: var(--deep); margin: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; text-align: center;
            transition: background 0.1s ease-out;
        }
        #timer { font-size: 8rem; font-weight: 900; color: var(--deep); line-height: 1; margin: 10px 0; }
        #status { font-size: 2rem; font-weight: bold; color: var(--orange); text-transform: uppercase; }
        #set-info { font-size: 1.2rem; margin-bottom: 20px; color: var(--deep); opacity: 0.8; }
        .card { 
            background: var(--white); padding: 2rem; border-radius: 30px; 
            box-shadow: 0 10px 0 var(--deep); width: 85%; max-width: 400px;
            border: 3px solid var(--black);
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 800; font-size: 0.9rem; margin-bottom: 5px; }
        select { 
            width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--deep); 
            font-size: 1.1rem; font-weight: bold; background: var(--bg);
        }
        .controls { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
        button { 
            flex: 1; padding: 18px; font-size: 1.2rem; font-weight: 900; 
            border-radius: 15px; border: 2px solid var(--black); cursor: pointer; 
        }
        #start-btn { background: var(--blue); color: var(--white); box-shadow: 0 5px 0 var(--deep); }
        #pause-btn { background: var(--yellow); color: var(--deep); box-shadow: 0 5px 0 var(--deep); display: none; }
        .stop-mode { background: var(--orange) !important; }
        .flash-orange { background: var(--orange) !important; }
        .flash-yellow { background: var(--yellow) !important; }
        .flash-blue { background: var(--blue) !important; }
    </style>
</head>
<body>

    <div id="status">READY</div>
    <div id="timer">0:00</div>
    <div id="set-info">Set: 0 / 0</div>

    <div class="card" id="setup-card">
        <div class="input-group">
            <label>NUMBER OF SETS</label>
            <select id="sets-input">
                <option value="1">1 Set</option>
                <option value="2">2 Sets</option>
                <option value="3">3 Sets</option>
                <option value="5">5 Sets</option>
                <option value="10">10 Sets</option>
            </select>
        </div>
        <div class="input-group">
            <label>SET DURATION</label>
            <select id="duration-input">
                <option value="10">10 Seconds (Test)</option>
                <option value="60">1 Minute</option>
                <option value="120">2 Minutes</option>
                <option value="180" selected>3 Minutes</option>
                <option value="300">5 Minutes</option>
            </select>
        </div>
        <div class="controls">
            <button id="start-btn" onclick="toggleStart()">START</button>
            <button id="pause-btn" onclick="togglePause()">PAUSE</button>
        </div>
    </div>

    <script>
        let mainInterval = null;
        let isRunning = false;
        let isPaused = false;
        let phase = 'PREP'; 
        let timeLeft = 0;
        let currentSet = 1;
        let totalSets = 0;
        let nextBeepTime = -1;
        let beepCountState = 1;

        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const infoEl = document.getElementById('set-info');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');

        let audioCtx = null;

        function flashScreen(colorClass) {
            document.body.classList.add(colorClass);
            setTimeout(() => document.body.classList.remove(colorClass), 200);
        }

        function playBeep(freq, dur, reps) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (phase === 'WORK') flashScreen(reps === 1 ? 'flash-orange' : 'flash-yellow');
            else if (phase === 'PREP') flashScreen('flash-blue');

            for (let i = 0; i < reps; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                    osc.start(); osc.stop(audioCtx.currentTime + dur);
                }, i * 200);
            }
        }

        function setNextRandomBeep() {
            if (timeLeft <= 5) { nextBeepTime = -1; return; }
            let gap = Math.floor(Math.random() * (60 - 5 + 1)) + 5;
            nextBeepTime = timeLeft - gap;
        }

        function formatTime(secs) {
            let m = Math.floor(secs / 60);
            let s = secs % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function tick() {
            if (isPaused) return;

            if (phase === 'PREP' && timeLeft <= 5 && timeLeft > 0) playBeep(440, 0.1, 1);

            timeLeft--;

            if (timeLeft < 0) {
                if (phase === 'PREP') {
                    phase = 'WORK';
                    timeLeft = parseInt(document.getElementById('duration-input').value);
                    setNextRandomBeep();
                    playBeep(880, 0.4, 1);
                } else {
                    if (currentSet < totalSets) {
                        currentSet++;
                        phase = 'PREP';
                        timeLeft = 5;
                    } else {
                        endWorkout();
                        return;
                    }
                }
            }

            if (phase === 'WORK' && timeLeft === nextBeepTime) {
                playBeep(660, 0.2, beepCountState);
                beepCountState = beepCountState === 1 ? 2 : 1;
                setNextRandomBeep();
            }

            timerEl.textContent = phase === 'PREP' ? timeLeft : formatTime(timeLeft);
            statusEl.textContent = phase;
            infoEl.textContent = `Set: ${currentSet} / ${totalSets}`;
        }

        function toggleStart() {
            if (isRunning) {
                endWorkout();
            } else {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume();
                
                isRunning = true;
                totalSets = parseInt(document.getElementById('sets-input').value);
                currentSet = 1;
                phase = 'PREP';
                timeLeft = 5;
                
                startBtn.innerText = 'STOP';
                startBtn.classList.add('stop-mode');
                pauseBtn.style.display = 'block';
                
                mainInterval = setInterval(tick, 1000);
                timerEl.textContent = timeLeft;
                statusEl.textContent = phase;
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? 'RESUME' : 'PAUSE';
        }

        function endWorkout() {
            clearInterval(mainInterval);
            isRunning = false; isPaused = false;
            startBtn.innerText = 'START';
            startBtn.classList.remove('stop-mode');
            pauseBtn.style.display = 'none';
            statusEl.textContent = 'COMPLETE';
            timerEl.textContent = '0:00';
        }
    </script>
</body>
</html>
