<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Reactive Pro Custom</title>
    <style>
        :root {
            --bg: #FCF7F2; --deep: #3D1F6E; --orange: #F2631A;
            --blue: #54BAF7; --yellow: #FFD447; --white: #FFFFFF; --black: #000000;
        }
        body { 
            font-family: sans-serif; background: var(--bg); 
            color: var(--deep); margin: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; text-align: center;
            transition: background 0.1s ease-out; overflow: hidden;
        }
        #timer { font-size: 7rem; font-weight: 900; line-height: 1; margin: 10px 0; }
        #status { font-size: 2rem; font-weight: bold; color: var(--orange); text-transform: uppercase; }
        #set-info { font-size: 1.2rem; margin-bottom: 15px; opacity: 0.8; }
        .card { 
            background: var(--white); padding: 1.5rem; border-radius: 30px; 
            box-shadow: 0 10px 0 var(--deep); width: 85%; max-width: 400px;
            border: 3px solid var(--black); overflow-y: auto; max-height: 80vh;
        }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-group { text-align: left; }
        label { display: block; font-weight: 800; font-size: 0.75rem; margin-bottom: 5px; text-transform: uppercase; }
        select { 
            width: 100%; padding: 10px; border-radius: 12px; border: 2px solid var(--deep); 
            font-size: 1rem; font-weight: bold; background: var(--bg);
        }
        .controls { display: flex; gap: 10px; width: 100%; }
        button { 
            flex: 1; padding: 18px; font-size: 1.2rem; font-weight: 900; 
            border-radius: 15px; border: 2px solid var(--black); cursor: pointer; 
        }
        #start-btn { background: var(--blue); color: var(--white); box-shadow: 0 5px 0 var(--deep); }
        #pause-btn { background: var(--yellow); color: var(--deep); box-shadow: 0 5px 0 var(--deep); display: none; }
        .stop-active { background: var(--orange) !important; }
        .flash-o { background: var(--orange) !important; }
        .flash-y { background: var(--yellow) !important; }
        .flash-b { background: var(--blue) !important; }
    </style>
</head>
<body>

    <div id="status">READY</div>
    <div id="timer">0:00</div>
    <div id="set-info">Set: 0 / 0</div>

    <div class="card">
        <div class="input-grid">
            <div class="input-group">
                <label>Sets</label>
                <select id="sets-input">
                    <script>for(let i=1;i<=10;i++) document.write(`<option value="${i}">${i}</option>`)</script>
                </select>
            </div>
            <div class="input-group">
                <label>Set Duration</label>
                <select id="dur-input">
                    <option value="10">10s (Test)</option>
                    <option value="60">1m</option>
                    <option value="180" selected>3m</option>
                    <option value="300">5m</option>
                </select>
            </div>
        </div>

        <div class="input-grid">
            <div class="input-group">
                <label>Min Interval (s)</label>
                <select id="min-rand">
                    <script>for(let i=5;i<=55;i++) document.write(`<option value="${i}">${i}s</option>`)</script>
                </select>
            </div>
            <div class="input-group">
                <label>Max Interval (s)</label>
                <select id="max-rand">
                    <script>for(let i=10;i<=60;i++) document.write(`<option value="${i}" ${i==30?'selected':''}>${i}s</option>`)</script>
                </select>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn" onclick="toggle()">START</button>
            <button id="pause-btn" onclick="p()">PAUSE</button>
        </div>
    </div>

    <script>
        let timer = null, running = false, paused = false, phase = 'PREP';
        let time = 0, set = 1, total = 0, nextBeep = -1, beepState = 1;
        let audio = null;

        function flash(c) {
            document.body.classList.add(c);
            setTimeout(() => document.body.classList.remove(c), 200);
        }

        function beep(f, d, r) {
            if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
            if (audio.state === 'suspended') audio.resume();
            if (phase === 'WORK') flash(r === 1 ? 'flash-o' : 'flash-y');
            else if (phase === 'PREP') flash('flash-b');
            for (let i = 0; i < r; i++) {
                setTimeout(() => {
                    let o = audio.createOscillator(), g = audio.createGain();
                    o.connect(g); g.connect(audio.destination);
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.6, audio.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + d);
                    o.start(); o.stop(audio.currentTime + d);
                }, i * 200);
            }
        }

        function setBeep() {
            if (time <= 5) { nextBeep = -1; return; }
            let min = parseInt(document.getElementById('min-rand').value);
            let max = parseInt(document.getElementById('max-rand').value);
            if (min >= max) max = min + 1; // Safety check
            
            let gap = Math.floor(Math.random() * (max - min + 1)) + min;
            nextBeep = time - gap;
        }

        function fmt(s) {
            return Math.floor(s/60) + ":" + (s%60).toString().padStart(2, '0');
        }

        function tick() {
            if (paused) return;
            if (phase === 'PREP' && time <= 5 && time > 0) beep(440, 0.1, 1);
            time--;
            if (time < 0) {
                if (phase === 'PREP') {
                    phase = 'WORK'; time = parseInt(document.getElementById('dur-input').value);
                    setBeep(); beep(880, 0.4, 1);
                } else {
                    if (set < total) { set++; phase = 'PREP'; time = 5; }
                    else { stop(); return; }
                }
            }
            if (phase === 'WORK' && time === nextBeep) {
                beep(660, 0.2, beepState);
                beepState = (beepState === 1) ? 2 : 1;
                setBeep();
            }
            document.getElementById('timer').textContent = phase === 'PREP' ? time : fmt(time);
            document.getElementById('status').textContent = phase;
            document.getElementById('set-info').textContent = "Set: " + set + " / " + total;
        }

        function toggle() {
            if (running) { stop(); } 
            else {
                running = true; total = parseInt(document.getElementById('sets-input').value);
                set = 1; phase = 'PREP'; time = 5;
                document.getElementById('start-btn').innerText = 'STOP';
                document.getElementById('start-btn').classList.add('stop-active');
                document.getElementById('pause-btn').style.display = 'block';
                timer = setInterval(tick, 1000);
            }
        }

        function p() {
            paused = !paused;
            document.getElementById('pause-btn').innerText = paused ? 'RESUME' : 'PAUSE';
        }

        function stop() {
            clearInterval(timer); running = false; paused = false;
            document.getElementById('start-btn').innerText = 'START';
            document.getElementById('start-btn').classList.remove('stop-active');
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('status').textContent = 'READY';
            document.getElementById('timer').textContent = '0:00';
        }
    </script>
</body>
</html>
