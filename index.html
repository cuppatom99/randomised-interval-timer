<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>HIIT Flow Pro</title>
    <style>
        :root {
            --bg-default: #FCF7F2; --deep: #3D1F6E; --orange: #F2631A;
            --blue: #54BAF7; --yellow: #FFD447; --white: #FFFFFF; --black: #000000;
        }
        body { 
            font-family: sans-serif; background-color: var(--bg-default); 
            color: var(--deep); margin: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; text-align: center;
            transition: background-color 0.2s ease, color 0.2s ease; overflow: hidden;
        }
        /* Your specific phase mapping */
        body.work-active { background-color: var(--blue); color: var(--white); }
        body.rest-active { background-color: var(--orange); color: var(--white); }

        #timer { font-size: 8rem; font-weight: 900; line-height: 1; margin: 10px 0; }
        #status { font-size: 3.5rem; font-weight: bold; text-transform: uppercase; margin: 0; }
        #set-info { font-size: 1.2rem; margin-bottom: 15px; opacity: 0.9; }

        .card { 
            background: var(--white); padding: 1.5rem; border-radius: 30px; 
            box-shadow: 0 10px 0 var(--deep); width: 85%; max-width: 400px;
            border: 3px solid var(--black); overflow-y: auto; max-height: 85vh;
            color: var(--deep);
        }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .input-group { text-align: left; }
        label { display: block; font-weight: 800; font-size: 0.7rem; margin-bottom: 5px; text-transform: uppercase; }
        select { 
            width: 100%; padding: 10px; border-radius: 12px; border: 2px solid var(--deep); 
            font-size: 0.9rem; font-weight: bold; background: var(--bg-default);
        }
        .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 10px; }
        button { 
            padding: 18px; font-size: 1.2rem; font-weight: 900; 
            border-radius: 15px; border: 2px solid var(--black); cursor: pointer; 
        }
        #start-btn { background: var(--blue); color: var(--white); box-shadow: 0 5px 0 var(--deep); }
        #quit-btn { background: var(--orange); color: var(--white); box-shadow: 0 5px 0 var(--deep); display: none; margin-top: 20px; }
        
        .flash-trigger { background-color: var(--white) !important; color: var(--black) !important; }
    </style>
</head>
<body>

    <div id="status">READY</div>
    <div id="timer">0:00</div>
    <div id="set-info">Set: 0 / 0</div>

    <div class="card" id="config-card">
        <div class="input-grid">
            <div class="input-group">
                <label>Main Sets</label>
                <select id="sets-input">
                    <script>for(let i=1;i<=10;i++) document.write(`<option value="${i}">${i}</option>`)</script>
                </select>
            </div>
            <div class="input-group">
                <label>Set Duration</label>
                <select id="dur-input">
                    <option value="60">1m</option>
                    <option value="120">2m</option>
                    <option value="180" selected>3m</option>
                    <option value="300">5m</option>
                </select>
            </div>
        </div>

        <div class="input-grid">
            <div class="input-group">
                <label>Min Gap</label>
                <select id="min-rand">
                    <script>for(let i=5;i<=55;i++) document.write(`<option value="${i}">${i}s</option>`)</script>
                </select>
            </div>
            <div class="input-group">
                <label>Max Gap</label>
                <select id="max-rand">
                    <script>for(let i=10;i<=60;i++) document.write(`<option value="${i}" ${i==30?'selected':''}>${i}s</option>`)</script>
                </select>
            </div>
        </div>

        <div class="input-group" style="margin-bottom: 15px;">
            <label>Rest Between Main Sets</label>
            <select id="rest-input">
                <script>for(let i=5;i<=60;i+=5) document.write(`<option value="${i}" ${i==30?'selected':''}>${i}s</option>`)</script>
            </select>
        </div>

        <div class="controls">
            <button id="start-btn" onclick="toggle()">START TRAINING</button>
        </div>
    </div>

    <button id="quit-btn" onclick="stop()">QUIT TO MENU</button>

    <script>
        let timer = null, running = false, phase = 'PREP';
        let time = 0, set = 1, total = 0, nextBeep = -1, isWork = true, audio = null;

        const body = document.body;
        const statusEl = document.getElementById('status');
        const timerEl = document.getElementById('timer');

        function flash() {
            body.classList.add('flash-trigger');
            setTimeout(() => body.classList.remove('flash-trigger'), 150);
        }

        function beep(f, d, r) {
            if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
            if (audio.state === 'suspended') audio.resume();
            
            for (let i = 0; i < r; i++) {
                setTimeout(() => {
                    let o = audio.createOscillator(), g = audio.createGain();
                    o.connect(g); g.connect(audio.destination);
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.7, audio.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + d);
                    o.start(); o.stop(audio.currentTime + d);
                }, i * 200);
            }
        }

        function setBeep() {
            if (time <= 5) { nextBeep = -1; return; }
            let min = parseInt(document.getElementById('min-rand').value);
            let max = parseInt(document.getElementById('max-rand').value);
            if (min >= max) max = min + 1;
            nextBeep = time - (Math.floor(Math.random() * (max - min + 1)) + min);
        }

        function tick() {
            // Countdown beeps for Phase starts
            if ((phase === 'PREP' || phase === 'INTERSET-REST') && time <= 5 && time > 0) beep(440, 0.1, 1);
            
            time--;

            if (time < 0) {
                if (phase === 'PREP' || phase === 'INTERSET-REST') {
                    // Start the Work portion of the set
                    phase = 'SET-ACTIVE';
                    isWork = true;
                    time = parseInt(document.getElementById('dur-input').value);
                    setBeep();
                    beep(880, 0.4, 1);
                    body.className = 'work-active';
                } else if (phase === 'SET-ACTIVE') {
                    // Main set time expired
                    if (set < total) {
                        set++;
                        phase = 'INTERSET-REST';
                        time = parseInt(document.getElementById('rest-input').value);
                        beep(440, 0.5, 2);
                        body.className = '';
                    } else {
                        stop();
                        return;
                    }
                }
            }

            // The Reactive Internal Toggle (WORK/REST)
            if (phase === 'SET-ACTIVE' && time === nextBeep) {
                isWork = !isWork;
                body.className = isWork ? 'work-active' : 'rest-active';
                beep(660, 0.2, 3); // 3 beeps on every internal change
                setBeep();
            }

            statusEl.textContent = (phase === 'SET-ACTIVE') ? (isWork ? 'WORK' : 'REST') : phase.replace('-', ' ');
            timerEl.textContent = (time > 59) ? Math.floor(time/60) + ":" + (time%60).toString().padStart(2, '0') : time;
            document.getElementById('set-info').textContent = "Set: " + set + " / " + total;
        }

        function toggle() {
            running = true; 
            total = parseInt(document.getElementById('sets-input').value);
            set = 1; phase = 'PREP'; time = 5;
            document.getElementById('config-card').style.display = 'none';
            document.getElementById('quit-btn').style.display = 'block';
            timer = setInterval(tick, 1000);
        }

        function stop() {
            clearInterval(timer); 
            running = false;
            body.className = '';
            document.getElementById('config-card').style.display = 'block';
            document.getElementById('quit-btn').style.display = 'none';
            statusEl.textContent = 'READY';
            timerEl.textContent = '0:00';
        }
    </script>
</body>
</html>
